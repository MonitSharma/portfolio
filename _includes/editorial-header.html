<header class="site-header">
  <a class="site-identity" href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>
    <span class="site-name">Monit Sharma</span>
    <span class="site-role">Quantum computing &amp; scientific software</span>
  </a>
  <div class="header-controls">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/research/' | relative_url }}"{% if page.nav == 'research' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.nav == 'projects' or page.layout == 'project' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/writing/' | relative_url }}"{% if page.nav == 'writing' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a class="classroom-link" href="https://monitsharma.github.io/" target="_blank" rel="noopener">Classroom <span aria-hidden="true">↗</span></a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
