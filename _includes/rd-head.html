<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.preview %}<meta name="robots" content="noindex">
{% endif %}<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1715" media="(prefers-color-scheme: dark)">
<title>{{ include.title }}</title>
<meta name="description" content="{{ include.description | strip_newlines | escape }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/quantum-mark.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{{ include.type | default: 'website' }}">
<meta property="og:site_name" content="Monit Sharma">
<meta property="og:title" content="{{ include.title }}">
<meta property="og:description" content="{{ include.description | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ include.image | default: '/assets/imgs/portrait-preview.jpg' | absolute_url }}">
<meta name="twitter:card" content="{% if include.image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:site" content="@_MonitSharma">
<script>(function(){var r=document.documentElement,t;try{t=localStorage.getItem('ms-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.dataset.theme=t;r.classList.add('js');if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches)r.classList.add('js-reveal');})();</script>
<link rel="stylesheet" href="{{ '/assets/css/preview-fonts.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}">
<script defer src="{{ '/assets/js/rd-site.js' | relative_url }}"></script>
