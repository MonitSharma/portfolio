{% comment %}Line-art motif for a book cover. Param: art (0–5).
0 orbit · 1 interference waves · 2 qubit lattice · 3 circuit · 4 contours · 5 bar chart.
Drawn in currentColor with a hairline stroke; .gate shapes are filled with the cover's own colour.{% endcomment %}
<svg class="book-motif" viewBox="0 0 100 100" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
{% case include.art %}
{% when 0 %}
  <ellipse cx="50" cy="50" rx="42" ry="15" transform="rotate(-24 50 50)" vector-effect="non-scaling-stroke"/>
  <ellipse cx="50" cy="50" rx="42" ry="15" transform="rotate(32 50 50)" vector-effect="non-scaling-stroke"/>
  <circle cx="50" cy="50" r="4.5" fill="currentColor" stroke="none"/>
{% when 1 %}
  <path d="M4 22 q11.5 -2 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
  <path d="M4 32 q11.5 -5 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
  <path d="M4 42 q11.5 -8 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
  <path d="M4 52 q11.5 -10 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
  <path d="M4 62 q11.5 -8 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
  <path d="M4 72 q11.5 -5 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
  <path d="M4 82 q11.5 -2 23 0 t23 0 t23 0 t23 0" vector-effect="non-scaling-stroke"/>
{% when 2 %}
  <path d="M18 18 H82 M18 39.3 H82 M18 60.7 H82 M18 82 H82 M18 18 V82 M39.3 18 V82 M60.7 18 V82 M82 18 V82" vector-effect="non-scaling-stroke"/>
  <path d="M18 18 L39.3 39.3 L60.7 60.7 L82 82" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
  <g class="gate">
    <circle cx="18" cy="18" r="3.6"/><circle cx="39.3" cy="18" r="3.6"/><circle cx="60.7" cy="18" r="3.6"/><circle cx="82" cy="18" r="3.6"/>
    <circle cx="18" cy="39.3" r="3.6"/><circle cx="39.3" cy="39.3" r="3.6"/><circle cx="60.7" cy="39.3" r="3.6"/><circle cx="82" cy="39.3" r="3.6"/>
    <circle cx="18" cy="60.7" r="3.6"/><circle cx="39.3" cy="60.7" r="3.6"/><circle cx="60.7" cy="60.7" r="3.6"/><circle cx="82" cy="60.7" r="3.6"/>
    <circle cx="18" cy="82" r="3.6"/><circle cx="39.3" cy="82" r="3.6"/><circle cx="60.7" cy="82" r="3.6"/><circle cx="82" cy="82" r="3.6"/>
  </g>
  <circle cx="39.3" cy="39.3" r="3.6" fill="currentColor" stroke="none"/>
  <circle cx="60.7" cy="60.7" r="3.6" fill="currentColor" stroke="none"/>
{% when 3 %}
  <path d="M4 22 H96 M4 42 H96 M4 62 H96 M4 82 H96" vector-effect="non-scaling-stroke"/>
  <path d="M44 22 V68" vector-effect="non-scaling-stroke"/>
  <g class="gate">
    <rect x="12" y="15" width="14" height="14" rx="1.5"/>
    <rect x="12" y="55" width="14" height="14" rx="1.5"/>
    <circle cx="44" cy="62" r="6"/>
    <rect x="58" y="35" width="15" height="34" rx="1.5"/>
    <rect x="80" y="75" width="13" height="13" rx="1.5"/>
  </g>
  <circle cx="44" cy="22" r="2.8" fill="currentColor" stroke="none"/>
  <path d="M38 62 H50 M44 56 V68" vector-effect="non-scaling-stroke"/>
  <path d="M83 85 a3.6 3.6 0 0 1 7.2 0 M86.6 85 l2.6 -5" vector-effect="non-scaling-stroke"/>
{% when 4 %}
  <g transform="rotate(-16 50 50)">
    <ellipse cx="50" cy="52" rx="44" ry="33" vector-effect="non-scaling-stroke"/>
    <ellipse cx="53" cy="50" rx="35" ry="26" vector-effect="non-scaling-stroke"/>
    <ellipse cx="56" cy="48.5" rx="26.5" ry="19.5" vector-effect="non-scaling-stroke"/>
    <ellipse cx="58.5" cy="47.5" rx="18" ry="13" vector-effect="non-scaling-stroke"/>
    <ellipse cx="60.5" cy="47" rx="10" ry="7" vector-effect="non-scaling-stroke"/>
    <circle cx="61.5" cy="46.8" r="2.2" fill="currentColor" stroke="none"/>
  </g>
{% else %}
  <path d="M6 88 H94" vector-effect="non-scaling-stroke"/>
  <g class="gate">
    <rect x="12" y="66" width="10" height="22"/>
    <rect x="29" y="54" width="10" height="34"/>
    <rect x="46" y="60" width="10" height="28"/>
    <rect x="63" y="36" width="10" height="52"/>
    <rect x="80" y="16" width="10" height="72"/>
  </g>
  <path d="M17 58 L34 44 L51 50 L68 26 L85 8" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
{% endcase %}
</svg>
