# Physical qubits and expected wall-clock time to factor one RSA-2048 integer.
# Checked against the primary papers in November 2026. `bound: true` marks an
# "at most this long" budget point, not a point estimate. `days` is the plotting value.
# Families: surface, atoms, qldpc, cat, hybrid. Ours: see `ours` below.

