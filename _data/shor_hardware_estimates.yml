# Conditional scenarios from Sec. 6 and Appendix F.
# For cat and Pinnacle comparisons, ref_qubits places the reference at the candidate's physical cap.
ours:
  - {id: our-surface, change: -14.2, name: "Our surface-code scenario", circuit: "1,450 logical qubits · k = 2", family: surface, qubits: 997192, days: 2.66, time: "2.66 days", ref_qubits: 980000, ref_days: 3.10, ref_label: "Reconstructed reference: ≈980,000 qubits, 3.10 days", note: "Fits the one-million-physical-qubit cap with 2,808 qubits to spare under the model’s routing allowance.", headline: true}
  - {id: our-balanced, change: 15.4, name: "Our Cain balanced scenario", circuit: "1,450 logical qubits · k = 2", family: atoms, qubits: 13255, days: 10701.825, time: "29.3 years", ref_qubits: 13255, ref_days: 9277.35, ref_label: "Reference retuned to w₁ = 7: 25.4 years", note: "Fastest candidate that fits the 1,480-logical-qubit LP24 memory in the balanced processor. The footprint is the published balanced design’s allocation.", headline: true}
  - {id: our-pinnacle, change: -59.6, name: "Our Pinnacle 1.0 scenario", circuit: "1,450 logical qubits · k = 2", family: qldpc, qubits: 109860, days: 6.05, time: "6.05 days", ref_qubits: 109860, ref_days: 14.99, ref_label: "Reference retuned within 109,860 qubits: 14.99 days", note: "One processing unit, assuming Pinnacle 1.0’s published timing and error rates continue to apply.", headline: true}
  - {id: our-cat, change: -12.5, name: "Our cat-qubit scenario", circuit: "2,925 logical qubits · k = 34", family: cat, qubits: 51703, days: 0.561, time: "0.561 days", range: [0.412, 0.561], ref_qubits: 51703, ref_days: 0.642, ref_label: "Fastest listed single-chip point within 51,703 qubits: 0.642 days", note: "The two overhead scenarios retain the serial movement, preparation and measurement overhead (0.561 days) or set it to zero (0.412 days).", headline: true}
