# Our conditional scenarios (the paper's Secs. 6–7). Each pairs with the reference
# tuned for the same model. These are projections, not compiled layouts.
ours:
  - {id: our-surface, change: -56.0, name: "Our surface-code scenario", circuit: "Lazy residues, six primes (k = 6, w₁ = 8)", family: surface, qubits: 1320000, days: 1.36, time: "1.36 days", ref_qubits: 980000, ref_days: 3.10, ref_label: "Published configuration: 980,000 qubits, 3.10 days", note: "Simplified layout model: one hot surface-code patch per added logical qubit, exponent in cold storage.", headline: true}
  - {id: our-balanced, change: -21.4, name: "Our Cain balanced scenario", circuit: "Trimmed, two primes (k = 2, w₁ = 7)", family: atoms, qubits: 13255, days: 7268.0, time: "19.9 years", ref_qubits: 13255, ref_days: 9277.0, ref_label: "Reference retuned to w₁ = 7: 25.4 years", note: "Fits the 1,480-logical-qubit memory of the balanced processor. Our reconstruction of the Cain et al. timing model, 1 ms cycle.", headline: true}
  - {id: our-pinnacle, change: -21.5, name: "Our Pinnacle 1.0 scenario", circuit: "Lazy residues, eight primes (k = 8)", family: qldpc, qubits: 142260, days: 4.72, time: "4.72 days", ref_qubits: 142080, ref_days: 6.01, ref_label: "Pinnacle reference retuned in the same budget: 6.01 days", note: "One processing unit; assumes Pinnacle’s timing and error model still apply to the wider unit.", headline: true}
  - {id: our-cat, change: -18.5, name: "Our cat-qubit scenario", circuit: "Lazy residues, eight primes (k = 8)", family: cat, qubits: 30153, days: 1.29, time: "1.29 days", range: [1.13, 1.62], ref_qubits: 29003, ref_days: 1.59, ref_label: "Fastest listed single-chip point in budget: 1.59 days", note: "Varying the uncompiled movement and measurement overhead from 0.5× to 2× gives 1.13–1.62 days.", headline: true}
  - {id: our-cat-k2, change: -32.8, name: "Cat qubits · trimmed, two primes", circuit: "Trimmed, two primes (k = 2)", family: cat, qubits: 24133, days: 2.11, time: "2.11 days", ref_qubits: 22593, ref_days: 3.14, ref_label: "Serial reference: 3.14 days", note: "Conditional transfer at fixed code distances (Table 8)."}
  - {id: our-cat-k6, change: -56.4, name: "Cat qubits · lazy, six primes", circuit: "Lazy residues, six primes (k = 6)", family: cat, qubits: 28123, days: 1.37, time: "1.37 days", ref_qubits: 22593, ref_days: 3.14, ref_label: "Serial reference: 3.14 days", note: "Conditional transfer at fixed code distances (Table 8)."}
  - {id: our-pin-k2, change: -41.4, name: "Pinnacle · trimmed, two primes", circuit: "Trimmed, two primes (k = 2)", family: qldpc, qubits: 108240, days: 9.11, time: "9.11 days", ref_qubits: 108240, ref_days: 15.54, ref_label: "Pinnacle reference retuned in budget: 15.54 days", note: "Conditional transfer at fixed code distances (Table 8)."}
  - {id: our-pin-k6, change: -34.2, name: "Pinnacle · lazy, six primes", circuit: "Lazy residues, six primes (k = 6)", family: qldpc, qubits: 130920, days: 5.19, time: "5.19 days", ref_qubits: 130920, ref_days: 7.89, ref_label: "Pinnacle reference retuned in budget: 7.89 days", note: "Conditional transfer at fixed code distances (Table 8)."}

# Operating points of one paper under the same assumptions, drawn as one trade-off line.
series:
  - {id: cain, name: "Cain et al. 2026", note: "Neutral atoms, 1 ms cycle: space-efficient → balanced → parallel"}
  - {id: pin10, name: "Pinnacle 1.0", note: "10⁻³ error, 1 µs cycle: qubits needed for ≤ 1 month, ≤ 1 week, ≤ 1 day"}
  - {id: cat, name: "Pappalardo et al. 2026", note: "Cat qubits: space-efficient → balanced → time-efficient"}

families:
  - {id: surface, name: "Surface code"}
  - {id: qldpc, name: "Superconducting qLDPC"}
  - {id: atoms, name: "Neutral atoms"}
  - {id: cat, name: "Cat qubits"}
