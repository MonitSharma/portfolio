  - {id: our-surface-volume, change: -63.2, name: "Surface code · least spacetime", circuit: "1,861 logical qubits · k = 8", family: surface, qubits: 1621000, days: 1.14, time: "1.14 days", ref_qubits: 980000, ref_days: 3.10, ref_label: "Reconstructed reference: ≈980,000 qubits, 3.10 days", note: "Lowest projected spacetime of the 42 circuits: 1.84 million physical qubit-days."}
  - {id: our-compact, change: -16.3, name: "Our Cain space-efficient scenario", circuit: "1,403 logical qubits · k = 1", family: atoms, qubits: 11033, days: 33493.425, time: "91.7 years", ref_qubits: 11033, ref_days: 39994.875, ref_label: "Reference retuned to w₁ = 5: 109.5 years", note: "Fastest candidate within the LP24 memory limit for this processor. The footprint is the published space-efficient design’s allocation."}
