  resources:
  - label: Source code & SDK examples
    url: https://github.com/MonitSharma/MettleQ
  - label: Raw timing and accuracy CSV
    url: https://github.com/MonitSharma/MettleQ/blob/main/bench/runs/20260718-adaptive-final/results.csv
  - label: Apple/NVIDIA benchmark contracts & data
    url: https://github.com/MonitSharma/MettleQ/tree/development/windows_baseline
  explanation:
  - title: An SDK-first simulator
    text: The goal is to keep existing quantum workflows usable while changing the
      execution engine underneath them. A Qiskit BackendV2 and registered PennyLane
      devices expose the simulator through each library’s normal circuit and result
      interfaces. Adaptive devices can select a CPU or Apple-GPU path based on the
      circuit, precision, and available memory.
  - title: Choosing the right simulation contract
    text: 'An exact statevector stores every amplitude, so its memory cost grows exponentially
      with qubit count. Matrix-product states offer a different tradeoff: their useful
      range depends on entanglement and the allowed bond dimension. Asking an MPS
      backend to materialize a complete dense state removes much of that advantage,
      which is why this benchmark states its full-state contract explicitly.'
  - title: Apple and NVIDIA at matched circuit widths
    text: The comparison record runs six circuit families at 15, 20, 24, 26, and 28
      qubits on M3 Pro Metal and an RTX 3070 under Windows/WSL. Each uses one warm-up
      and three measured repetitions. The small-width results favor MettleQ, while
      CUDA-Q wins at 28 qubits; launch overhead and circuit structure affect the crossover.
      These are separate machines, and the full-state contract should be kept in view.
