  slug: mettleq
  page: "/work/mettleq/"
  source_url: https://github.com/MonitSharma/MettleQ/tree/main/bench/runs/20260718-adaptive-final
  source_label: Read the benchmark record
  code_url: https://github.com/MonitSharma/MettleQ
  question: When does an Apple GPU become faster than the CPU backends already used
    in quantum workflows?
  findings:
  - In the supplied final crossover run, the 20-qubit Qiskit full-state call took
    32.95 ms on MettleQ GPU versus 38.28 ms on Aer CPU.
  - The PennyLane full-state call took 19.29 ms on MettleQ GPU versus 161.52 ms on
    Lightning CPU at 20 qubits.
  - The GPU crossed Aer at 20 qubits and Lightning at 16 qubits in this measured workload.
    Smaller circuits can favor the CPU.
  method:
  - Run the same depth-3 circuits on an Apple M3 Pro with 18 GPU cores and 36 GB RAM.
  - Compare complete statevectors through each SDK adapter, with warm-up and repeated
    timing. Disable Aer circuit truncation to preserve agreement with independent
    references.
  - Accept a row only after phase-aligned state error passes the 5×10⁻⁶ threshold.
    The accepted rows had errors below 4.1×10⁻⁷.
  boundary: These are measured full-state calls at 16–20 qubits, not a universal speedup
    claim. CPU references use complex128; GPU correctness is assessed against the
    stated numerical tolerance. The source checkout identifies MettleQ as alpha research
    software.
  table:
    caption: Apple M3 Pro · depth 3 · CPU time / GPU time; a ratio above 1 means GPU
      was faster
    columns:
    - Qubits
    - Aer / MettleQ
    - Lightning / MettleQ
    rows:
    - - '16'
      - 0.234×
      - 1.453×
    - - '18'
      - 0.801×
