  explanation:
  - title: Turning inversion into polynomial approximation
    text: QSVT acts on a block-encoding of a matrix and applies a polynomial to its
      singular values. Approximating the reciprocal implements the core of a linear
      solve without reading out each eigenvalue. The project checks this chain against
      ordinary linear algebra before using a small hardware experiment to test the
      compiled toolchain.
  - title: Why the CFD comparison changes the question
    text: Pressure-correction solves appear repeatedly inside computational fluid
      dynamics. Their matrices can be sparse yet poorly conditioned, and the polynomial
      degree grows with the condition number. A modest qubit count therefore does
      not imply an executable circuit. The measured classical baselines and resource
      estimates point toward conditioning and usable preconditioners as the research
      bottleneck.
