  explanation:
  - title: Recovering a center from noisy samples
    text: A peaked circuit concentrates its ideal output near a particular bitstring.
      Hardware noise spreads the observations into a cloud of nearby strings, so the
      most frequent exact sample may be an incomplete description. The weighted observed
      medoid selects an actual sample that minimizes total Hamming distance to the
      complete distribution; cluster consensus estimates the common bit at each position
      in the dominant group.
  - title: Keeping repairs separate from decoding
    text: 'Provider framing problems are addressed before candidate recovery. The
      original output is preserved, structural duplicates are documented, and all
      corrected valid shots enter the analysis. This separation matters: repairing
      repeated output segments is different from discarding shots because they disagree
      with a desired answer. The P11 and P12 packages retain enough intermediate evidence
      to audit that distinction offline.'
