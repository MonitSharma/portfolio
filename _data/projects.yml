  - label: Detailed scientific results
    url: https://github.com/MonitSharma/quantum_chemistry/blob/2fe2s/research/2fe2s/RESULTS.md
  explanation:
  - title: Why this cluster is a demanding benchmark
    text: Iron–sulfur clusters contain strongly interacting electrons, making them
      useful tests of electronic-structure methods. Here the active space contains
      30 electrons in 20 spatial orbitals. Even after fixing the spin sector, the
      explicit determinant space contains more than 240 million states, so both numerical
      correctness and computational resources matter.
  - title: Energy alone is not enough
    text: A variational energy gives an upper bound, but a very small energy change
      does not guarantee that an eigenstate is fully converged. The residual checks
      how closely the explicit state satisfies the eigenvalue equation. Comparing
      it with norm, spin, and independently evaluated energies makes the quality of
      the reference easier to assess before judging a quantum proposal.
