  explanation:
  - title: Using the logo’s structure
    text: 'The oracle must assign the required phase to each of the 4,096 pixels of
      a 64 × 64 image while cleaning up its work qubits. Rather than treating every
      pixel independently, the construction uses the repeated row and column patterns:
      11 classes can each be represented by a four-bit code. This reduces the structure
      that the central phase operation has to encode.'
  - title: Optimizing the interfaces as well as the gates
    text: 'The circuit loads class codes, applies a 63-term phase polynomial, and
      reverses the loading computation. Gate count alone does not determine depth:
      the arrival time of each signal and the dependencies between operations also
      affect the schedule. Ready-time scheduling and loader/phase interfaces therefore
      form part of the optimization, followed by exhaustive verification of the completed
      circuit.'
- slug: qsvt-linear-solvers
  page: "/work/qsvt-linear-solvers/"
  title: QSVT Linear Solvers
  category: Quantum scientific computing
  type: research
  summary: A quantum linear-system solver built from primitives, tested on IBM and
    Quantinuum hardware, and compared with classical solvers.
  metric: 2 vendors
  metric_label: hardware validation · explicit classical baselines
  code_url: https://github.com/MonitSharma/qsvt-linear-solvers
  source_url: https://github.com/MonitSharma/qsvt-linear-solvers/blob/main/README.md
  source_label: Read the findings
  question: What actually limits a quantum linear solver on the matrices used inside
    computational fluid dynamics?
  detail: QSVT approximates matrix inversion with a bounded polynomial applied to
    a block-encoding. This project checks each layer against ordinary linear algebra,
    runs a small solve on two hardware platforms, and measures the classical baseline
    on the same matrix families.
  findings:
  - For the 2×2 hardware solve, IBM Kingston measured 11.4% solution probability against
    an 11.9% noiseless ideal; its 95% interval includes the ideal.
  - Quantinuum Helios-1 measured 7.9%, with a 95% interval of 5.8–10.7%. The 3.2σ
    discrepancy is not explained by shot noise alone.
  - On the CFD benchmark, even the smallest 16×16 matrix requires polynomial degree
    11,357 under the reported cost model. All four classical systems solve in under
    1.4 ms.
  method:
  - Build block-encoding and polynomial approximation from primitives, checking simulated
    solutions against NumPy.
  - Report hardware probabilities with 95% Wilson confidence intervals, including
    post-selection counts.
  - Reproduce the open Rolls-Royce CFD matrix spectra, estimate polynomial and gate
    costs, and measure sparse-LU baselines.
  boundary: This is a correctness and toolchain demonstration, not a quantum advantage
    result. Circuit depth and conditioning remain the binding constraints. CFD resource
    counts are estimates rather than executed hardware runs; the Helios discrepancy
    remains undiagnosed.
  resources:
  - label: Findings & limitations
    url: https://github.com/MonitSharma/qsvt-linear-solvers/blob/main/LIMITATIONS.md
  - label: Hardware evidence
    url: https://github.com/MonitSharma/qsvt-linear-solvers/tree/main/hardware
  - label: CFD analysis script
    url: https://github.com/MonitSharma/qsvt-linear-solvers/blob/main/docs/cfd_analysis.py
  table:
    caption: 2×2 QSVT solve · probabilities conditional on post-selection
    columns:
    - Backend
