# Numbers transcribed from "Shared Lookups and Lazy Residues" (code base v2.5).
# Toffoli counts are expected Toffolis per RSA-2048 factoring (t_fact) unless noted.
# Do not round further: the page prints these values as given.

published:
  model: {qubits: 1399, tfact: 5.84e+9, note: "Published cost model, Ref. Table 5, with the address-determined simplifications (6.50e+9 without them)."}
  benchmark: {qubits: 1435, tshot: 6.46e+8, tfact: 5.88e+9, note: "Same circuit counted by our benchmark; loop 4 adds 33 carry and 3 bookkeeping qubits."}

# Table 1. change_best: vs. best improved reference setting at that budget.
# change_plain: vs. best reference setting without banking and the half-modulus quotient.
# change_model: vs. best setting of the published cost model alone.
equal_budget:
  - {id: A, name: "Trimmed, two primes", detail: "k = 2, w₁ = 7, refined", qubits: 1459, tfact: 3.89e+9, ref: 4.27e+9, change_best: -9.0, change_plain: -23.4, change_model: -27.8, change_published: -33.9, pareto: true}
  - {id: B, name: "Lazy, six primes", detail: "k = 6, w₁ = 8, refined", qubits: 1685, tfact: 2.19e+9, ref: 3.47e+9, change_best: -36.8, change_plain: -46.3, change_model: -49.1, change_published: -62.7, pareto: true}
  - {id: C, name: "Lazy, nine primes", detail: "k = 9, w₁ = 8, refined", qubits: 1801, tfact: 1.81e+9, ref: 3.28e+9, change_best: -44.8, change_plain: -55.0, change_model: -58.1, change_published: -69.3, pareto: true}
  - {id: D, name: "Trimmed, all checkpoints", detail: "k = 1, no sharing", qubits: 1520, tfact: 5.06e+9, ref: 3.93e+9, change_best: 28.7, change_model: 1.2, change_published: -14.1, pareto: false}
  - {id: E, name: "Lazy residues", detail: "k = 1, no sharing", qubits: 1530, tfact: 4.86e+9, ref: 3.91e+9, change_best: 24.1, change_model: -2.7, change_published: -17.5, pareto: false}

# Table 6. Cumulative construction path vs. the benchmark-counted published configuration.
construction_paths:
  - id: C
    label: "To row C · nine primes, 1,801 qubits"
    steps:
      - {name: "Published configuration (benchmark)", qubits: 1435, tshot: 6.46e+8, tfact: 5.88e+9, kind: base, why: "Gidney’s low-qubit circuit at its published parameters, counted by our benchmark."}
      - {name: "+ shared lookups, k = 2", qubits: 1473, tshot: 5.16e+8, tfact: 4.70e+9, change: -20.1, kind: core, why: "Primes with the same exponent window share one table read. Two primes per lookup halve the loop-1 lookups."}
      - {name: "+ k = 4, larger window (8 bits)", qubits: 1601, tshot: 4.20e+8, tfact: 3.82e+9, change: -35.0, kind: core, why: "Sharing divides the lookup cost by k, so a wider window becomes worthwhile: fewer windows and fewer primes."}
      - {name: "+ k = 6, all checkpoints", qubits: 1729, tshot: 3.15e+8, tfact: 2.87e+9, change: -51.2, kind: core, why: "Keep every intermediate residue of loop 3, so cleanup subtracts the same table values instead of recomputing them."}
      - {name: "+ trimmed register", qubits: 1690, tshot: 3.03e+8, tfact: 2.76e+9, change: -53.2, kind: core, why: "The discrete-log sum fits in 29 qubits instead of 32, saving 3k qubits and three division steps."}
      - {name: "+ lazy residues (k = 6)", qubits: 1690, tshot: 2.86e+8, tfact: 2.60e+9, change: -55.7, kind: core, why: "With checkpoints, residues no longer need to be canonical: add plain integers and reduce once at the end."}
      - {name: "Lazy residues, k = 8", qubits: 1806, tshot: 2.61e+8, tfact: 2.37e+9, change: -59.7, kind: core, why: "Eight primes per lookup, the widest sharing before the further refinements."}
      - {name: "+ packed differences, CRT shortcut", qubits: 1757, tshot: 2.57e+8, tfact: 2.34e+9, change: -60.3, kind: refine, why: "Store signed differences in 22 bits instead of 29 (word 232 → 176 bits), and build loop-4 tables directly for the lazy representative."}
      - {name: "+ partial-sum cleanup", qubits: 1757, tshot: 2.46e+8, tfact: 2.23e+9, change: -62.0, kind: refine, why: "Erase what remains of a residue by X-basis measurement and a 512-entry phase lookup."}
      - {name: "+ k = 9, overlapping words", qubits: 1806, tshot: 2.35e+8, tfact: 2.14e+9, change: -63.6, kind: refine, why: "Nine primes per 203-bit word. The first word is measured and released early to stay within 1,806 qubits."}
      - {name: "+ non-restoring division", qubits: 1806, tshot: 2.29e+8, tfact: 2.08e+9, change: -64.6, kind: refine, why: "Fold each pending add-back into the next subtraction; restore only the final remainder."}
      - {name: "+ half-period logarithms", qubits: 1803, tshot: 2.25e+8, tfact: 2.05e+9, change: -65.2, kind: refine, why: "Adding (p − 1)/2 to a logarithm negates the residue, so keep the low part and carry a sign bit."}
      - {name: "+ half-modulus quotient", qubits: 1803, tshot: 2.19e+8, tfact: 1.99e+9, change: -66.1, kind: refine, why: "Divide by (p − 1)/2: the residue exponent shrinks from 21 to 20 bits and the last tables halve."}
      - {name: "+ banked direct lookup", qubits: 1801, tshot: 2.02e+8, tfact: 1.84e+9, change: -68.7, kind: refine, why: "Split a 12-bit lookup into banks: 653 Toffolis instead of about 4,080, so it can replace a whole multiplication."}
      - {name: "+ banked multiplication lookups (row C)", qubits: 1801, tshot: 1.99e+8, tfact: 1.81e+9, change: -69.3, kind: refine, why: "Bank the 64-entry multiplication-table loads too: 26 + 21 instead of 57 Toffolis per load."}
  - id: A
    label: "To row A · two primes, 1,459 qubits"
    steps:
      - {name: "Published configuration (benchmark)", qubits: 1435, tshot: 6.46e+8, tfact: 5.88e+9, kind: base, why: "Gidney’s low-qubit circuit at its published parameters, counted by our benchmark."}
      - {name: "Trimmed, k = 2, w₁ = 7", qubits: 1461, tshot: 4.95e+8, tfact: 4.51e+9, change: -23.3, kind: core, why: "Two primes per lookup, a 7-bit window and a 29-qubit discrete-log register."}
      - {name: "+ measured cleanup", qubits: 1461, tshot: 4.74e+8, tfact: 4.32e+9, change: -26.6, kind: refine, why: "Erase partial sums by measurement and a phase lookup instead of arithmetic."}
      - {name: "+ non-restoring division, CRT fold", qubits: 1461, tshot: 4.67e+8, tfact: 4.25e+9, change: -27.8, kind: refine, why: "Cheaper long division, and fold the one-bit top CRT digit into the previous one: four accumulator updates instead of five."}
      - {name: "+ final checkpoint, compact CRT", qubits: 1459, tshot: 4.56e+8, tfact: 4.15e+9, change: -29.4, kind: refine, why: "Keep the input of the final multiplication and use a ripple adder that stores carries in the looked-up offset."}
      - {name: "+ banked tables, half period, blocked carries (row A)", qubits: 1459, tshot: 4.27e+8, tfact: 3.89e+9, change: -33.9, kind: refine, why: "Bank the multiplication-table loads, use half-period logarithms and put CRT carries in freed wires."}
  - id: B
    label: "To row B · six primes, 1,685 qubits"
    steps:
      - {name: "Published configuration (benchmark)", qubits: 1435, tshot: 6.46e+8, tfact: 5.88e+9, kind: base, why: "Gidney’s low-qubit circuit at its published parameters, counted by our benchmark."}
      - {name: "Lazy residues, k = 6, w₁ = 8", qubits: 1690, tshot: 2.86e+8, tfact: 2.60e+9, change: -55.7, kind: core, why: "The three changes together: six-prime sharing, all checkpoints and lazy residues."}
      - {name: "+ refinements and banking (row B)", qubits: 1685, tshot: 2.41e+8, tfact: 2.19e+9, change: -62.7, kind: refine, why: "Half-period logarithms, a banked four-window direct lookup and one retained partial sum, within 1,685 qubits."}

