<!DOCTYPE html>
<html lang="en">

{% include rd-head.html title=page_title description=page.description %}

{% if page.interactive %}<script defer src="{{ '/assets/js/rd-home.js' | relative_url }}"></script>{% endif %}
</head>

{% include editorial-footer.html %}

</body>
</html>
